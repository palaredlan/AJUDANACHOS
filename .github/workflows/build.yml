name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Completar estrutura nativa (android/ios) que falta no projeto
        run: flutter create . --project-name audio_bg_mixer --org com.example

      - name: Corrigir compileSdk para 35 (exigido pelos plugins de audio/ffmpeg)
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle

      - name: Baixar as dependencias do projeto
        run: flutter pub get

      - name: Primeira tentativa de build (baixa o .aar do ffmpeg, pode falhar - e esperado)
        run: flutter build apk --release || true

      - name: Limpar cache corrompido do gradle antes de tentar de novo
        run: rm -rf ~/.gradle/caches/transforms-3 ~/.gradle/caches/transforms-4 build

      - name: Segunda tentativa (build final, com o .aar ja baixado corretamente)
        run: flutter build apk --release

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
