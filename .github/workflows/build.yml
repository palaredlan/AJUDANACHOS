name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Completar estrutura nativa (android/ios) que falta no projeto
        run: flutter create . --project-name audio_bg_mixer --org com.example

      - name: Baixar as dependencias do projeto
        run: flutter pub get

      - name: Primeira tentativa de build (baixa o .aar do ffmpeg, pode falhar - é esperado)
        run: flutter build apk --release || true

      - name: Segunda tentativa (agora o .aar ja foi baixado, deve funcionar)
        run: flutter build apk --release

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
