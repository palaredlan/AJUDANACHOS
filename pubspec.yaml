name: audio_bg_mixer
description: App para adicionar musica de fundo em audios do WhatsApp
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^2.0.0
  receive_sharing_intent: ^1.8.1
  file_picker: ^8.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
